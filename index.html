<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <!-- スマホの画面幅に合わせて表示するための指定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1f6f5c">
  <title>朝IT</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="top-link left" href="settings.html">設定</a>
    <a class="top-link right" href="about.html">しくみ</a>
    <h1>朝IT</h1>
    <!-- 日付の切り替え（前の日 / 次の日） -->
    <nav class="date-nav">
      <button id="prev" aria-label="前の日">‹</button>
      <span id="date">読み込み中…</span>
      <button id="next" aria-label="次の日">›</button>
    </nav>
    <p id="score" class="score"></p>
  </header>

  <!-- カードはここに app.js が差し込む -->
  <main id="cards"></main>

  <!-- type="module" にすると、ページの読み込み後に実行される -->
  <script type="module" src="app.js"></script>
</body>
</html>
